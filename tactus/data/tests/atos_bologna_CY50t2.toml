[general]
  reference_date = "2026-06-18T00:00:00Z"
  selection = [
    "cy50t2_alaro_climate_files",
    "cy50t2_alaro",
    "cy50t2_alaro_ddh",
    "cy50t2_alaro_eps",
    "cy50t2_alaro_slaf",
    "cy50t2_alaro_mode_start",
    "cy50t2_arome_climate_files",
    "cy50t2_arome",
    "cy50t2_arome_ddh",
    "cy50t2_arome_eps",
    "cy50t2_arome_slaf",
    "cy50t2_arome_mode_start",
    "cy50t2_arome_target",
    "cy50t2_harmonie_arome_climate_files",
    "cy50t2_harmonie_arome",
    "cy50t2_harmonie_arome_ddh",
    "cy50t2_harmonie_arome_eps",
    "cy50t2_harmonie_arome_slaf",
    "cy50t2_harmonie_arome_mode_start",
    "cy50t2_harmonie_arome_target",
  ]

[general.compiler.gnu]
  active = false
  extra = ["tactus/data/config_files/modifications/submission/atos_bologna_gnu.toml"]

[general.compiler.intel]
  active = true

# Used with `tactus test --compile`: cy50t2_compile is added first to the
# selection, every selected case without a host gets it as host and mirrors
# its suite, and all cases use the binaries it installs.
[general.compile]
  case = "cy50t2_compile"

[general.compile.modifs.platform]
  install_dir = "@SCRATCH@/@SYS_NAME@/@CASE_PREFIX@_@CYCLE@_compile/install"

[general.compile.modifs.submission]
  bindir = "@SCRATCH@/@SYS_NAME@/@CASE_PREFIX@_@CYCLE@_compile/install/R64/bin"
  bindir_gl = "@SUBMISSION.BINDIR@"

[general.compile.modifs.submission.task_exceptions.Forecast.binaries.MASTERODB]
  bindir = "@SCRATCH@/@SYS_NAME@/@CASE_PREFIX@_@CYCLE@_compile/install/R64/bin"

[include]
  cases = "case_definitions_CY50t2.toml"
  macros = "test_macros.toml"
  modifs = "modifs_atos_bologna_CY50t2.toml"
  refchecks = "modifs_reference_checker.toml"
  genchecks = "modifs_reference_generate.toml"
