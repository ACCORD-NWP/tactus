[refchecks.platform]
  reference_tag = "v1.3.0"
  references_folder = "@REFCHECK_ROOT@/@REFERENCE_TAG@"
  references_generation_folder = "N/A"

[refchecks.reference_checker]
  check = true
  generate = false
  rules_active = [
    "C903_0-6.fafiles",
    "C903_0-6.namelist",
    "E923Monthly_06.fafiles",
    "E923Monthly_06.namelist",
    "E927_0-0.fafiles",
    "E927_3-3.fafiles",
    "E927_3-3.namelist",
    "InterpolSstSic.fafiles",
    "Forecast.fullpos",
    "Forecast.history",
    "Forecast.log",
    "Forecast.namelist",
    "Forecast.surfex",
    "PgdUpdate.fafiles",
    "Pgd.fafiles",
    "Pgd.namelist",
    "Prep.fafiles",
    "Prep.namelist",
  ]
  suppress_exception = false

[refchecks.reference_checker.task.PgdUpdate.fafiles]
  inpath = "@CLIMDIR@"
  pattern = "Const.Clim.*.sfx"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/climate/@DOMAIN@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/climate/@DOMAIN@"

[refchecks.reference_checker.task.Pgd.fafiles]
  inpath = "@CLIMDIR@"
  method = "HistoryFields"
  pattern = "PGD_prel.*.fa"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/climate/@DOMAIN@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/climate/@DOMAIN@"
  result_folder = "@WRK@/checks/static_data"

[refchecks.reference_checker.task.Pgd.namelist]
  inpath = "@CLIMDIR@/logs/Pgd"
  pattern = "OPTIONS.nam"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/climate/@DOMAIN@/namelists/Pgd"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/climate/@DOMAIN@/namelists/Pgd"
  result_folder = "@WRK@/checks/namelists/Pgd"

[refchecks.reference_checker.task.E923Monthly_06.fafiles]
  inpath = "@CLIMDIR@"
  pattern = "Const.Clim.06"
  method = "E923Files"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/climate/@DOMAIN@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/climate/@DOMAIN@"
  result_folder = "@WRK@/checks/static_data"

[refchecks.reference_checker.task.E923Monthly_06.namelist]
  inpath = "@CLIMDIR@/logs/E923Monthly_06"
  pattern = "fort.4(.*)"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/climate/@DOMAIN@/namelists/E923Monthly_06"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/climate/@DOMAIN@/namelists/E923Monthly_06"
  result_folder = "@WRK@/checks/namelists/E923Monthly_06"

[refchecks.reference_checker.task.C903_0-6.fafiles]
  inpath = "@INTP_BDDIR@"
  pattern = "ELS(.*)(000|003)(_slaf2)?$"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/initial_files"

[refchecks.reference_checker.task.C903_0-6.namelist]
  inpath = "@WRK@/logs/C903_0-6/"
  pattern = "fort.4"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/C903_0-6"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/C903_0-6"
  result_folder = "@WRK@/checks/namelists/C903_0-6"

[refchecks.reference_checker.task.Prep.fafiles]
  inpath = "@INTP_BDDIR_SFX@"
  pattern = "ICM(.*)INIT.sfx"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/initial_files"

[refchecks.reference_checker.task.Prep.namelist]
  inpath = "@WRK@/logs/Prep/"
  pattern = "OPTIONS.nam"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/Prep"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/Prep"
  result_folder = "@WRK@/checks/namelists/Prep"

[refchecks.reference_checker.task.InterpolSstSic.fafiles]
  inpath = "@INTP_BDDIR@"
  pattern = "EXT_SST_SIC003"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/initial_files"

[refchecks.reference_checker.task.Forecast.fullpos]
  inpath = "@ARCHIVE@"
  pattern = "GRIBPF.*0003h00m00s"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"

[refchecks.reference_checker.task.Forecast.history]
  inpath = "@ARCHIVE@"
  pattern = "ICMSH.*0003h00m00s"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"

[refchecks.reference_checker.task.Forecast.log]
  inpath = "@WRK@/logs/Forecast"
  pattern = "NODE.001_01"
  method = "ForecastNorms"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"

[refchecks.reference_checker.task.Forecast.namelist]
  inpath = "@WRK@/logs/Forecast"
  pattern = "(fort\\.4|EXSEG1\\.nam)"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/Forecast"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@/namelists/Forecast"
  result_folder = "@WRK@/checks/namelists"

[refchecks.reference_checker.task.Forecast.surfex]
  inpath = "@ARCHIVE@"
  pattern = "ICMSH.*0003h00m00s.sfx"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"

[refchecks.reference_checker.task.E927_0-0.fafiles]
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  inpath = "@INTP_BDDIR@"
  method = "HistoryFields"
  pattern = "ELS(.*)000"
  reference_folder = "@REFERENCES_FOLDER@/@REF_CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
