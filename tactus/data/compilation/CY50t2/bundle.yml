---
### Bundle
# Variable $GITHUB shall be set by the user according to the protocol to be used
# to connect to Github, e.g. GITHUB="https://github.com" to use https and tokens.

name    : ial-bundle
version : 50
cmake   : >
    INSTALL_LIB_DIR=lib
    ECBUILD_INSTALL_LIBRARY_HEADERS=OFF
    ECBUILD_INSTALL_FORTRAN_MODULES=OFF
    BUILD_fieldman=OFF
    BUILD_oops=ON
    BUILD_ial_dp=ON
    BUILD_ial_sp=OFF
    ENABLE_OMP=ON
    ENABLE_SINGLE_PRECISION=OFF
    ENABLE_DOUBLE_PRECISION=ON
    FFTW_ENABLE_MKL=OFF
    ENABLE_SCMEC=OFF
    ENABLE_ACC=OFF
    ENABLE_ODC=OFF
    ENABLE_OCEAN_COUPLING=OFF
    ENABLE_UNWAM=OFF
    ENABLE_CUDA=OFF
    ENABLE_IAL=ON
    ENABLE_OOPS=ON
    ENABLE_AEOLUS=OFF
    ENABLE_CUDA=OFF
    ENABLE_NEMO=OFF
    ENABLE_MGRIDS=OFF
    ENABLE_FORECAST_ONLY=OFF
    ENABLE_IFS_TEST=OFF
    ENABLE_SFX_MPI=ON
projects :
    - ecbuild :
        git     : ${GITHUB}/ecmwf/ecbuild
        version : 3.11.0
        bundle  : false
        gmkpack : 'hub/local/src/ecSDK'
        incremental_pack : False

    - eccodes :
        git     : ${GITHUB}/ecmwf/eccodes
        version : 2.45.0
        gmkpack : 'None'
        cmake   : >
            ENABLE_ECCODES_THREADS=ON
            ECCODES_ENABLE_NETCDF=ON
            ECCODES_ENABLE_FORTRAN=ON
            ECCODES_ENABLE_MEMFS=ON
            ECCODES_INSTALL_EXTRA_TOOLS=ON
            ENABLE_AEC=OFF
            ECCODES_ENABLE_JPG_LIBOPENJPEG=OFF

    - ial-source :
        git     : ${GITHUB}/pardallio/ACCORD-IAL
        version : feature/toolchain-flags
        bundle  : false
        gmkpack : 'src/local'
        gmkpack_filter_file : '.gmkpack_ignored'

    - eckit :
        git     : ${GITHUB}/ecmwf/eckit
        version : 1.19.0
        gmkpack : 'hub/local/src/ecSDK'
        incremental_pack : False
        cmake   : >
            ECKIT_ENABLE_XXHASH=OFF
            ECKIT_ENABLE_VIENNACL=OFF
            ECKIT_ENABLE_EIGEN=OFF
            ECKIT_ENABLE_ARMADILLO=OFF
            ECKIT_ENABLE_CUDA=OFF
            ECKIT_ENABLE_SANDBOX=OFF
            ECKIT_ENABLE_MKL=OFF
            ECKIT_ENABLE_LAPACK=OFF
            ECKIT_ENABLE_MPI=ON

    - fckit :
        git     : ${GITHUB}/ecmwf/fckit
        version : 0.14.2
        require : eckit
        gmkpack : 'hub/local/src/ecSDK'
        incremental_pack : False
        cmake   : >
                  FCKIT_ENABLE_FINAL=OFF
                  FCKIT_ENABLE_FCKIT_VENV=ON
                  FCKIT_ENABLE_FCKIT_VENV_EDITABLE=ON

    - fiat :
        git     : ${GITHUB}/ecmwf-ifs/fiat
        version : 1.6.2
        gmkpack : 'hub/local/src/Fiat'
        incremental_pack : False
        cmake   : >
                  FIAT_BUILD_SHARED_LIBS=OFF
                  FIAT_ENABLE_TESTS=OFF

    - falfilfa :
        git     : ${GITHUB}/ACCORD-NWP/falfilfa
        version : develop
        gmkpack : 'hub/local/src/FALFILFA'
        incremental_pack : False
        cmake   : >
                ENABLE_TESTS=OFF
                ENABLE_FREE_ECCODES_VERSION=ON


    - field_api :
        git     : ${GITHUB}/ecmwf-ifs/field_api
        require : fckit
        version : v0.3.2
        gmkpack : 'hub/local/src/Field_api'
        incremental_pack : False

    - ectrans :
        git     : ${GITHUB}/ACCORD-NWP/ectrans
        version : for-CY50T2
        gmkpack : 'hub/local/src/Ectrans'
        incremental_pack : False
        cmake   : >
                ECTRANS_ENABLE_ETRANS=ON
                ECTRANS_ENABLE_PROGRAMS=OFF

    - phyex :
        git     : ${GITHUB}/ACCORD-NWP/phyex
        version : 50T2_develop  # 50T2_develop branch
        gmkpack : 'hub/local/src/PHYEX'
        gmkpack_filter_file : 'gmkpack_ignored_files'
        incremental_pack : True
        cmake   : >
            PHYEX_ENABLE_IFS_FLAGS=ON

    - oops :
        git     : ${GITHUB}/ACCORD-NWP/oops
        version : for-CY50T2
        gmkpack : 'hub/local/src/OOPS'
        gmkpack_rename: 'oops_src'
        incremental_pack : False
        cmake   : >
            OOPS_ENABLE_ATLAS=ON

    - ecflow-light :
        git     : ${GITHUB}/ecmwf/ecflow-light
        version : 1.0.2
        require : eckit
        gmkpack : 'hub/local/src/ecFlow_light'
        gmkpack_rename : 'ecflow_light'
        incremental_pack : False

    - auxlibs :
        git     : ${GITHUB}/ACCORD-NWP/auxlibs
        version : ial_bundle
        bundle  : false
        gmkpack : 'None'

    - gribex :
         dir     : auxlibs/gribex_370
         require : auxlibs
         gmkpack : 'None'

    - bufr :
         dir     : auxlibs/bufr_405
         require : auxlibs
         gmkpack : 'None'

    - pinuts :
        git     : ${GITHUB}/ACCORD-NWP/pinuts
        version : 0.2.0
        gmkpack : 'hub/local/src/Pinuts'
        incremental_pack : False

    - surfex :
        git     : ${GITHUB}/ACCORD-NWP/SURFEX
        version : 50T2_develop
        gmkpack : 'hub/local/src/SURFEX'
        incremental_pack : False
        cmake   : >
            SURFEX_ENABLE_PGD_FRAC=ON
            SURFEX_ENABLE_IFS_FLAGS=ON

    - ial_dp :
        dir     : ial-source
        cmake   : >
            IAL_DP_ENABLE_IAL=ON
            IAL_DP_ENABLE_MGRIDS=OFF
            IAL_DP_ENABLE_HIRLAM_FYPP=ON
            IAL_DP_ENABLE_SINGLE_PRECISION=OFF
            IAL_DP_BUILD_SHARED_LIBS=OFF
            IAL_DP_ENABLE_ATLAS=OFF
        gmkpack : 'None'

    - ial_sp :
        dir     : ial-source
        cmake   : >
            IAL_SP_ENABLE_IAL=ON
            IAL_SP_ENABLE_MGRIDS=OFF
            IAL_SP_ENABLE_HIRLAM_FYPP=ON
            IAL_SP_BUILD_SHARED_LIBS=OFF
            IAL_SP_ENABLE_ATLAS=OFF
        gmkpack : 'None'

    - gl :
        git     : ${GITHUB}/pardallio/gl-acrd
        version : feature/cy50
        gmkpack : 'None'

options:
    - with-single-precision :
        help  : Add a single precision IAL build
        cmake : BUILD_ial_sp=ON ENABLE_SINGLE_PRECISION=ON

    - without-single-precision :
        help  : Remove single precision & add a double precision build
        cmake : BUILD_ial_sp=OFF BUILD_ial_dp=ON ENABLE_SINGLE_PRECISION=OFF

    - with-double-precision :
        help  : Add a double precision IAL build
        cmake : BUILD_ial_dp=ON

    - without-double-precision :
        help  : Remove double precision & add a single precision build
        cmake : >
            BUILD_ial_sp=ON
            BUILD_ial_dp=OFF
            ENABLE_SINGLE_PRECISION=ON
            ENABLE_DOUBLE_PRECISION=OFF
            ENABLE_HIRLAM_SP_HACKS=ON
    - forecast-only :
        help  : Build IAL in forecast configuration only
        cmake : >
            ENABLE_FORECAST_ONLY=ON
            ENABLE_OOPS=OFF
            BUILD_oops=OFF
            BUILD_atlas=OFF
            ENABLE_ATLAS=OFF

    - with-gpu-acc:
        help  : Enable GPU OpenACC compilation
        cmake : >
            ENABLE_CUDA=ON
            ENABLE_ACC=ON
