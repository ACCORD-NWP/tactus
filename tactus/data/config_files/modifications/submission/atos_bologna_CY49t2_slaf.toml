[submission.task_exceptions.Addpert]
  binary = "ADDPERT"
  WRAPPER = "srun"

[submission.task_exceptions.Addpert.BATCH]
  CPUS = "#SBATCH --cpus-per-task=1"
  MEM = "#SBATCH --mem=32GB"
  NODES = "#SBATCH --nodes=1"
  NTASKS = "#SBATCH --ntasks=1"
  WALLTIME = "#SBATCH --time=00:30:00"

[submission.task_exceptions.Addpert.ENV]
  DR_HOOK_ASSERT_MPI_INITIALIZED = 0
