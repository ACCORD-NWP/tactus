[archiving.test.copy.logs]
  active = true
  inpath = "@LOGS@"
  outpath = "@LOGS@/duplicate"
  pattern = "*.tar.gz"
  exclude = "*duplicate*"

[cleaning.PostMortem.test]
  active = true
  dry_run = false
  path = "@LOGS@/duplicate"

[collectlogs.test]
  joboutdir = "@ECF_OUT@/@CASE@"
  tarname = "Test"
  task_logs = "@WRK@"

[general]
  case = "test_ecflow"

[suite_control]
  suite_definition = "TestSuiteDefinition"
