[general]
  case = "Clean_Old_Data"
  keep_workdirs = false

[clean_old_data]
  cases_period = "P7D"
  force_delete_period = "P365D"
  ignore = []
  scratch_ext = "/deode"

[suite_control]
  suite_definition = "DeodeCleaningSuiteDefinition"

[suite_control.DeodeCleaningSuiteDefinition]
  days_in_week = [1]
  do_clean_cases = true
  do_clean_empty_dirs = true
  time_to_run = "07:30:00Z"

[system]
  wrk = "@CASEDIR@"
