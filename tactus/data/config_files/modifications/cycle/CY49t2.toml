[general]
  cycle = "CY49t2"
  surfex = true
  upd_sst_sic = true

[general.output_settings]
  surfex = "PT1H"

[suite_control]
  compile = false

[pgd]
  npatch = 3

[submission]
  gl_version = "gl-v1.9.2"
  ial_version = "CY49t2-v1.18.0"
  bindir = "@INSTALL_DIR_CY49T2@/@CYCLE@/@COMPILER@/R64/@IAL_VERSION@/bin"
  bindir_gl = "@INSTALL_DIR_CY49T2@/gl/@COMPILER@/@GL_VERSION@/bin/"

[submission.task_exceptions.E923Update.ENV]
  DR_HOOK_ASSERT_MPI_INITIALIZED = 0

[submission.task_exceptions.Forecast.binaries.MASTERODB]
  bindir = "@INSTALL_DIR_CY49T2@/@CYCLE@/@COMPILER@/@PRECISION@/@IAL_VERSION@/bin"

[submission.task_exceptions.GlBd]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.InterpolSstSic]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.PgdUpdate]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.CreateGrib]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.CreateGribStatic]
  bindir = "@BINDIR_GL@"

[submission.types.parallel.MODULES]
  # First load the prgenv
  00_PRGENV = ["load", "prgenv/intel"]
  # The rest
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2026.01.0.0"]
  FFTW = ["load", "fftw/3.3.10"]
  HDF5 = ["load", "hdf5/1.14.6"]
  MKL = ["load", "intel-mkl/19.0.5"]
  NETCDF = ["load", "netcdf4/4.9.3"]
  OPENMPI = ["load", "hpcx-openmpi/2.9.0"]

[submission.types.serial.MODULES]
  # First load the prgenv
  00_PRGENV = ["load", "prgenv/intel"]
  # The rest
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2026.01.0.0"]
  FFTW = ["load", "fftw/3.3.10"]
  HDF5 = ["load", "hdf5/1.14.6"]
  MKL = ["load", "intel-mkl/19.0.5"]
  NETCDF = ["load", "netcdf4/4.9.3"]
  OPENMPI = ["load", "hpcx-openmpi/2.9.0"]