[general]
  cycle = "CY50t2"
  surfex = true
  upd_sst_sic = false

[general.output_settings]
  surfex = "PT1H"

[submission]
  precision = "R64"
  ial_version = "latest"
  bindir = "@INSTALL_DIR@/@IAL_VERSION@/R64/intel/2021.4.0/hpcx-openmpi/2.9.0/bin"

  bindir_gl = "@SUBMISSION.BINDIR@"

[submission.task_exceptions.E923Update]
  bindir = "@INSTALL_DIR_CY49T2@/CY49t2/intel/R64/latest/bin"
  binary = "fa_sfx2clim"

[submission.task_exceptions.E923Update.ENV]
  DR_HOOK_ASSERT_MPI_INITIALIZED = 0

[submission.task_exceptions.Forecast]
  bindir = "@INSTALL_DIR@/@IAL_VERSION@/@PRECISION@/intel/2021.4.0/hpcx-openmpi/2.9.0/bin"

[submission.task_exceptions.Forecast.binaries.lfitools]
  binary = "lfitools_dp"

[submission.task_exceptions.IOmerge]
  binary = "lfitools_dp"

[submission.task_exceptions.Pgd]
  binary = "pgd_dp"

[submission.task_exceptions.Pgd.ENV]
  DR_HOOK_ASSERT_MPI_INITIALIZED = 0

[submission.task_exceptions.PgdFilterTownFrac]
  bindir = "@INSTALL_DIR_CY49T2@/CY49t2/intel/R64/latest/bin"
  binary = "pgd_frac"

[submission.task_exceptions.Prep]
  binary = "prep_dp"

[submission.task_exceptions.Prep.ENV]
  DR_HOOK_ASSERT_MPI_INITIALIZED = 0
