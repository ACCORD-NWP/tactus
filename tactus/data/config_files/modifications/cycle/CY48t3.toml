[general]
  cycle = "CY48t3"
  fullpos_windpower = false
  upd_sst_sic = false

[platform]
  rttov_coefdir = "@STATIC_DATA@/satellite/rtcoef_rttov12/harm_coef/"

[submission]
  bindir = "@INSTALL_DIR@/@CYCLE@/@IAL_VERSION@/bin"
  bindir_gl = "@INSTALL_DIR@/gl/@COMPILER@/@GL_VERSION@/bin/"
  compiler = ""
  precision = ""

[submission.task_exceptions.GlBd]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.InterpolSstSic]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.PgdUpdate]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.CreateGrib]
  binary = "gl"
  bindir = "@BINDIR_GL@"

[submission.task_exceptions.CreateGribStatic]
  bindir = "@BINDIR_GL@"

[suite_control]
  do_interpolsstsic = false
  compile = false

[gribmodify.fullpos.3]
  output_name = "tp"

[gribmodify.fullpos.4]
  output_name = "10si"

[gribmodify.fullpos.5]
  output_name = "ws"

[gribmodify.fullpos.6]
  minimum_frequency = "PT1H"
  output_name = "max_i10fg"
