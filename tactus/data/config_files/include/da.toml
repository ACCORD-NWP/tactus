[da]
  scratch = "@CASEDIR@/da/@YYYY@/@MM@/@DD@/@HH@/@MEMBER_STR@"
  obs_provider = "LACE"

[da.surface]
  method = "CANARI"
  active = true
  odbconverter = "Obsconvert"
  obs_types = ["synop"]
  bator_window_len = "PT3H"
  bator_window_shift = "-PT90M"
  bator_slot_len = "PT0H"
  bator_nbslot = 1
  nbpool = 16

[da.upper_air]
  method = "3DVAR"
  active = false
  odbconverter = "Obsconvert"
  obs_types = [
    "synop",
    "gpssol",
    "amdar",
    "geowind",
    "temp",
    "wp",
    "seviri",
    "amsua",
    "amsub",
    "iasi",
    "ascat",
  ]
  bator_window_len = "PT3H"
  bator_window_shift = "-PT90M"
  bator_slot_len = "PT0H"
  bator_nbslot = 1
  nbpool = 128

[da.providers.LACE]
  obs_step = "PT1H"

[da.providers.LACE.obstypes.synop]
  obs_step = "PT0H"
  format = "OBSOUL"
  candidates = [
    "obsoul_1_xxxxxx_hu_{ymdhh}",
    "obsoul_1_xxxxxy_hu_{ymdhh}",
    "obsoul_1_xxxxxy_at_{ymdhh}",
    "obsoul_1_xxxxxy_cz_{ymdhh}",
    "obsoul_1_xxxxxy_sk_{ymdhh}",
