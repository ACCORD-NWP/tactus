# ------------------------------------------------------------------
# RMI — Royal Meteorological Institute of Belgium.
# ------------------------------------------------------------------
[da.providers.RMI]
  obs_step = 0

[da.providers.RMI.obstypes.synop]
  format = "BUFR"
  candidates = ["synop_{ymdrr}00.bufr"]

# ------------------------------------------------------------------
# MF — Météo-France BDAP convention.
# Fill in correct filenames for your BDAP access point.
# ------------------------------------------------------------------
[da.providers.MF]
  # Add MF observation types below
  obs_step = 60

[da.providers.MARS]
  # Add ECMWF MARS observation types below
