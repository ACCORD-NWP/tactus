[reference_checker]
  check = false
  generate = false
  rules_active = [
    "PgdUpdate.default",
    "Forecast.fullpos",
    "Forecast.history",
    "Forecast.log",
    "Forecast.surfex"
  ]
  create_summary = ["PrepRun"]
  analyze_summary = ["ReferenceCheck"]
  summary_active = ["txt", "json"]
  suppress_exception = false
  label_suffix = "@MEMBER_STR@"

[reference_checker.methods.NamelistDiff]
  tool = "namelist_checker"
  ignore_case = true
  ignore_blank_lines = true
  ignore_whitespace = true

[reference_checker.methods.ForecastNorms]
  mode = "get_worst"
  tolerance = "0"
  tool = "norms_checker"
  which = "first_and_last_spectral"

[reference_checker.methods.FullPosFields]
  args_template = "-f1 {test_file} -f2 {reference_file} {file_format} -s -of SCREEN -de -to {tolerance}"
  binary = "@BINDIR_GL@/xtool_DP"
  file_format = "GRIB"
  tolerance = "-10"
  tool = "xtool"

[reference_checker.methods.HistoryFields]
  args_template = "-f1 {test_file} -f2 {reference_file} {file_format} -s -of SCREEN -de -to {tolerance}"
  binary = "@BINDIR_GL@/xtool_DP"
  file_format = "FA"
  tolerance = "-10"
  tool = "xtool"

[reference_checker.methods.E923Files]
  args_template = "-f1 {test_file} -f2 {reference_file} {file_format} -s -of SCREEN -de -to {tolerance} -igd"
  binary = "@BINDIR_GL@/xtool_DP"
  file_format = "FA"
  tolerance = "-10"
  tool = "xtool"

[reference_checker.summary.json]
  file = "@CASEDIR@/checks/summary.json"
  format = "json"

[reference_checker.summary.txt]
  file = "@CASEDIR@/checks/summary.txt"
  format = "txt"

  # Optional Ciboulai summary stack output: add "ciboulai" to summary_active to
  # activate. It writes one pair of files (<task>.itself.json /
  # <task>.consistency.json) per checked task in the directory defined below, and
  # publishes them to the Ciboulai server configured in [reference_checker.ciboulai].
  # [reference_checker.summary.ciboulai]
  #   file = "@CASEDIR@/checks/summaries_stack"
  #   format = "ciboulai"

[reference_checker.ciboulai]
  # Connection to the Ciboulai server used to publish the summary stack files.
  # Publication is triggered automatically as soon as a summary with format "ciboulai"
  # is listed in summary_active; set enabled = false to only keep the files on disk.
  # The token is read from the environment variable CIBOULAI_TOKEN, or from the
  # first line of token_file.
  enabled = true
  server = "https://www.umr-cnrm.fr/davai/"
  token_file = "~/.ciboulai_token"
  # The experiment name is built from the pattern, e.g. ttr-0112-atos_bologna@cvap,
  # where {counter} is the value of counter_file, incremented the first time a name
  # is needed, and {machine} and {user} are the platform host and the unix user.
  # The resolved name is written to name_file (ciboulai.cfg) and reused by all the
  # tasks of the experiment.
  experiment_name = "ttr-{counter}-{machine}@{user}"
  name_file = "@CASEDIR@/checks/ciboulai.cfg"
  counter_file = "@SCRATCH@/@SYS_NAME@/ciboulai/counter"
  # Number of tries, delay between tries and timeout, in seconds, for one send
  tries = 3
  sleep = 3
  timeout = 60

[reference_checker.task.PgdUpdate.default]
  inpath = "@CLIMDIR@"
  pattern = "Const.Clim.*.sfx"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/climate/@DOMAIN@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/climate/@DOMAIN@"
  result_folder = "@WRK@/checks/static_data"

[reference_checker.task.Forecast.namelist]
  inpath = "@WRK@/logs/Forecast"
  pattern = "(fort\\.4|EXSEG1\\.nam)"
  method = "NamelistDiff"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/namelists/Forecast"

[reference_checker.task.Forecast.fullpos]
  inpath = "@ARCHIVE@"
  pattern = "GRIBPF.*0006h00m00s"
  method = "FullPosFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/Forecast"

[reference_checker.task.Forecast.history]
  inpath = "@ARCHIVE@"
  pattern = "ICMSH.*0006h00m00s"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/Forecast"

[reference_checker.task.Forecast.log]
  inpath = "@WRK@/logs/Forecast"
  pattern = "NODE.001_01"
  method = "ForecastNorms"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/Forecast"

[reference_checker.task.Forecast.surfex]
  inpath = "@ARCHIVE@"
  pattern = "ICMSH.*0006h00m00s.sfx"
  method = "HistoryFields"
  generate_folder = "@REFERENCES_GENERATION_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  reference_folder = "@REFERENCES_FOLDER@/@CASE@/@ARCHIVE_TIMESTAMP@/@MEMBER_STR@"
  result_folder = "@WRK@/checks/Forecast"
