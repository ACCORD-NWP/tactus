name: Build and Deploy Documentation
on:
  push:
    branches:
      - master
      - develop
    paths:
      - '**.py'
      - '*.rst'
      - '*.md'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - '**.py'
      - '*.rst'
      - '*.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
    contents: write

jobs:
  docs:
    if: github.repository_owner == 'destination-earth-digital-twins'
    name: Generate API Documentation
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv (if cache exists)
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ github.job }}-venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/poetry.toml') }}

      - name: Install dependencies (if venv cache is not found)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --only main,doc

      - name: Install the project itself
        run: poetry install --no-interaction --only-root

      - name: Build documentation
        run: make doc-build

      - name: Deploy to https://github.com/destination-earth-digital-twins/deode-workflow-docs
        if: ${{ github.event_name == 'published' }}
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: 'docs/_build/'
          destination-repository-name: 'destination-earth-digital-twins/deode-workflow-docs'
          target-branch: gh-pages
          target-directory: docs/
          user-name: Deode Workflow API Doc Builder
          user-email: Deode-Workflow@noreply.github.com
