name: Build and Deploy Documentation
on:
  push:
    branches:
      - master
      - develop
    paths:
      - '**.py'
      - '*.rst'
      - '*.md'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - '**.py'
      - '*.rst'
      - '*.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
    contents: write

jobs:
  build-docs:
    if: github.repository_owner == 'ACCORD-NWP'
    name: Generate API Documentation
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv (if cache exists)
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ github.job }}-venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/poetry.toml') }}

      - name: Install dependencies (if venv cache is not found)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --only main,doc

      - name: Install the project itself
        run: poetry install --no-interaction --only-root

      - name: Build documentation
        run: make doc-build

      # Upload the book's HTML as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs/_build/"

  deploy-docs:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    name: "Deploy docs"
    needs: build-docs
    runs-on: "ubuntu-latest"
    permissions:
      pages: write
      id-token: write

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
