#.github/workflows/tests.yaml
name: Unit Tests

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

jobs:
  tests:
    if: github.repository_owner == 'destination-earth-digital-twins'
    strategy:
      fail-fast: true
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10" ]

    name: "Unit-tests ${{ matrix.os }}, python=${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Install ping
        run: |
          apt-get update
          apt-get install -y inetutils-ping

      - name: Install Pixi and dependencies
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
          run-install: true
          manifest-path: pyproject.toml
          post-cleanup: true
          frozen: true
          cache: true
          auth-host: github.com
          auth-token: ${{ secrets.GH_REPO_READ_TOKEN }}
          activate-environment: true

      - name: Install additional dependency groups
        run: |
          pixi run bootstrap

      - name: Run tests
        run: pixi run pytest -n auto --maxprocesses 16


      # Disable upload to codecov until/if codecov is enabled
