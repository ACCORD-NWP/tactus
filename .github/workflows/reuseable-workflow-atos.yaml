on:
  workflow_call:
    secrets:
      HPC_CI_SSH_USER:
        required: true
      GH_REPO_READ_TOKEN:
        required: true
      GH_RELEASE_PAT_TEST:
        required: true
    inputs:
      configuration_name:
        required: true
        type: string

jobs:
  test-install-deode-workflow-atos:
    runs-on: [hpc]
    continue-on-error: false
    steps:

      - name: Test installation phase on Atos
        id: test-install-deode-workflow-atos
        uses: ecmwf/reusable-workflows/ci-hpc-generic@main
        with:
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          template: |
              pwd

              # Download artifact from GitHub
              echo "Downloading artifact from GitHub..."
              curl -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer {{ gh_token }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/{{ repo_name }}/actions/artifacts" \
                -o artifacts.json

              # Get the artifact ID for 'Packages'
              artifact_id=$(python3 -c "import json; data=json.load(open('artifacts.json')); print(next((a['id'] for a in data['artifacts'] if a['name']=='Packages' and a['workflow_run']['id']=={{ run_id }}), None))")
              echo "Artifact ID: $artifact_id"

              # Download the artifact
              mkdir -p dist
              curl -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer {{ gh_token }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/{{ repo_name }}/actions/artifacts/$artifact_id/zip" \
                -o packages.zip

              unzip -o packages.zip -d dist
              ls -la dist/
              cd dist
              pwd

              module load python3/3.10.10-01
              curl -fsSL https://pixi.sh/install.sh | bash
              export PATH="$HOME/.pixi/bin:$PATH"
              pixi install
              pixi run bootstrap
              pixi run pip install dist/deode-*.whl
              pixi run deode -h
          template_data: |
              repo: https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/${{ github.repository }}.git
              repo_name: ${{ github.repository }}
              gh_token: ${{ secrets.GH_RELEASE_PAT_TEST }}
              run_id: ${{ github.run_id }}
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              github_event_name: ${{ github.event_name }}
              pull_request_number: ${{ github.event.number }}
              pull_request_branch_name: ${{ github.head_ref }}
          sbatch_options: |
              #SBATCH --job-name=test_deode_workflow
              #SBATCH --time=00:15:00

  run-forecast-deode-workflow-atos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [hpc]
    needs: test-install-deode-workflow-atos
    steps:

      - name: Run forecast on Atos
        id: run-forecast-atos
        uses: ecmwf/reusable-workflows/ci-hpc-generic@main
        with:
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          template: |
              # Use a predictable base folder for the temporary workspace.
              workflow_base="$HOME/ci-hpc"
              mkdir -p "$workflow_base"
              # mktemp replaces XXXXXX with random characters.
              workflow_folder=$(mktemp -d "$workflow_base/XXXXXX")
              # Clean up the temp folder when the job exits.
              trap 'rm -rf "$workflow_folder"' EXIT
              cd "$workflow_folder"
              pwd
              git clone {{ repo }}
              cd Deode-Workflow

              event_name={{ github_event_name }}

              # Check out the right ref for the current event type.
              if [[ $event_name == 'workflow_dispatch' ||  $event_name == 'push' ]]; then git checkout {{ ref }}; fi

              # Fetch locally the pull request branch and switch to it.
              if [[ $event_name == 'pull_request' ]]; then
                git fetch origin pull/{{ pull_request_number }}/head:{{ pull_request_branch_name }}; \
                git switch {{ pull_request_branch_name }}; \
              fi

              module load python3/3.10.10-01
              curl -fsSL https://pixi.sh/install.sh | bash
              export PATH="$HOME/.pixi/bin:$PATH"
              pixi install
              pixi run bootstrap

              echo 'configuration_name='${{ inputs.configuration_name }}
              # actor_username is the GitHub user who triggered the workflow.
              echo "actor_username="{{ actor_username }}

              # Use the repo root as the workflow folder.
              DEODE_WORKFLOW_FOLDER="$PWD"
              echo $DEODE_WORKFLOW_FOLDER
              cd $DEODE_WORKFLOW_FOLDER

              # Run deode via pixi environment.
              run_date=$(date +%Y%m%d_%H%M)
              # Use a local modifications file to override the case name per run.
              cat > github_modifications.toml<<EOF
              [general]
                case = "@CASE_PREFIX@@CYCLE@_@CSC@_@EVENT_TYPE@_@DOMAIN@_@YMD_START@_{{ actor_username }}_workflow_test_date_${run_date}"
              EOF
              cat github_modifications.toml
              echo $(pwd)/github_modifications.toml  >> deode/data/config_files/configurations/${{ inputs.configuration_name }}
              cat deode/data/config_files/configurations/${{ inputs.configuration_name }}

              pixi run deode case ?deode/data/config_files/configurations/${{ inputs.configuration_name }} -o ${{ inputs.configuration_name }}.toml --start-suite

              # Add executable permission.
              chmod u+x test_worfklow_scripts/export_case_variables.py
              export_command=$(pixi run python test_worfklow_scripts/export_case_variables.py $DEODE_WORKFLOW_FOLDER/${{ inputs.configuration_name }}.toml)
              echo $export_command > export_command.sh
              source export_command.sh

              module load ecflow
              # Ensure ecflow Python bindings are visible to system python.
              export PYTHONPATH="$ECFLOW_DIR/lib/python3.10/site-packages:$ECFLOW_DIR/lib64/python3.10/site-packages:${PYTHONPATH:-}"
              python3  test_worfklow_scripts/get_suite_status.py $ECF_HOST $ECF_PORT $SUITE_NAME
          template_data: |
              repo: https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/${{ github.repository }}.git
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              github_event_name: ${{ github.event_name }}
              pull_request_number: ${{ github.event.number }}
              pull_request_branch_name: ${{ github.head_ref }}
              actor_username: ${{ github.actor }}
          sbatch_options: |
              #SBATCH --job-name=test_deode_workflow_run_forecast
              #SBATCH --time=00:60:00

  build-deode-workflow-atos:
    if: ${{ github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch'}}
    runs-on: [hpc]
    needs: test-install-deode-workflow-atos
    steps:

      - name: Build Deode-Workflow Wheel
        id: build-deode-workflow-atos
        uses: ecmwf/reusable-workflows/ci-hpc-generic@main
        with:
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          template: |
            pwd
            git clone {{ repo }}
            cd Deode-Workflow
            git checkout {{ ref }}
            module load python3/3.10.10-01
            curl -fsSL https://pixi.sh/install.sh | bash
            export PATH="$HOME/.pixi/bin:$PATH"
            pixi install
            pixi run bootstrap
            pixi run pip install build
            pixi run python -m build --wheel
            tar -cf deode_workflow-${{ github.sha }}.tar.gz dist pyproject.toml
            mv deode_workflow-${{ github.sha }}.tar.gz $SCRATCH/deode_workflow-${{ github.sha }}.tar.gz
          template_data: |
            repo: https://${{ secrets.GH_REPO_READ_TOKEN }}@github.com/${{ github.repository }}.git
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sbatch_options: |
            #SBATCH --job-name=build_deode_workflow
            #SBATCH --time=00:20:00

  install-deode-workflow-atos:
    runs-on: [hpc]
    needs: build-deode-workflow-atos
    steps:

      - name: Install Deode-Workflow Wheel
        id: install-deode-workflow-atos
        uses: ecmwf/reusable-workflows/ci-hpc-generic@main
        with:
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          template: |
            cp $SCRATCH/deode_workflow-${{ github.sha }}.tar.gz .
            tar -xf deode_workflow-${{ github.sha }}.tar.gz
            module load python3/3.10.10-01
            python3 -m venv .venv
            source .venv/bin/activate
            export DEODEVERSION=$(grep -A 2 '^\[project\]' pyproject.toml | grep 'version' | awk -F\" '{print $2}')
            python3 -m pip install dist/deode-$DEODEVERSION-py3-none-any.whl
            deode -h
          sbatch_options: |
            #SBATCH --job-name=install_deode_workflow
            #SBATCH --time=00:05:00
