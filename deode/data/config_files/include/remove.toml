[remove.defaults]
  active = true
  dry_run = true
  ncycles_delay = 0
  wipe = true

[remove.ehype]
  remove_from_scheduler = true
  remove_not_completed_suites = false
  suite_name = "DE_Impact_EHYPE_forecast_@CASE@_@YMD_START@_@HH_START@"

[remove.ehype.ehype_output]
  path = "@IMPACT.EHYPE.COMMUNICATE.RUN_ROOT@/@CASE@_@YMD_START@_@HH_START@"

[remove.ehype.ehype_run]
  path = "@IMPACT.EHYPE.COMMUNICATE.RUN_ROOT@/run/@REMOVE.EHYPE.SUITE_NAME@"

[remove.ehype.ehype_work]
  path = "@IMPACT.EHYPE.COMMUNICATE.WORK_ROOT@/@REMOVE.EHYPE.SUITE_NAME@"

[remove.eps_upscaling]
  remove_from_scheduler = true
  remove_not_completed_suites = false
  suite_name = "@IMPACT.EPS_UPSCALING.COMMUNICATE.GENERAL.CASE@"

[remove.eps_upscaling.temp_repo]
  active = "@IMPACT.EPS_UPSCALING.GIT.REMOVE_DIR@"
  path = "@IMPACT.EPS_UPSCALING.GIT.DIR@"

[remove.main]
  remove_from_scheduler = true
  remove_not_completed_suites = false
  suite_name = "@CASE@"

[remove.main.ecfs]
  ecfs_prefix = "@ECFS_PREFIX@"
  path = ""

[remove.main.ifs]
  active = false
  path = "@REFERENCE_DATA@/IFS"

[remove.main.zz_case_dir]
  path = "@CASEDIR@"

[remove.nwp2windpower]
  remove_from_scheduler = true
  remove_not_completed_suites = false
  suite_name = "@IMPACT.NWP2WINDPOWER.COMMUNICATE.GENERAL.CASE@"

[remove.nwp2windpower.output_dir]
  path = "@IMPACT.NWP2WINDPOWER.COMMUNICATE.NWP2WINDPOWER.OUTPUT_DIR@"

[remove.nwp2windpower.temp_repo]
  active = "@IMPACT.NWP2WINDPOWER.GIT.REMOVE_DIR@"
  path = "@IMPACT.NWP2WINDPOWER.GIT.DIR@"

[remove.wildfire]
  remove_from_scheduler = true
  remove_not_completed_suites = false
  suite_name = "WildFire_@CASE@"

[remove.wildfire.temp_repo]
  active = "@IMPACT.WILDFIRE.GIT.REMOVE_DIR@"
  path = "@IMPACT.WILDFIRE.GIT.DIR@"

[remove.wildfire.wildfire_workdir]
  path = "@IMPACT.WILDFIRE.COMMUNICATE.WORKDIR@"
