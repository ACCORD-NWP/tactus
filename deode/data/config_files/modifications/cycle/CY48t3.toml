[general]
  cycle = "CY48t3"
  fullpos_windpower = false
  upd_sst_sic = false

[platform]
  rttov_coefdir = "@STATIC_DATA@/satellite/rtcoef_rttov12/harm_coef/"

[submission]
  bindir = "@INSTALL_DIR@/@CYCLE@/@IAL_VERSION@/bin"
  compiler = ""
  precision = ""

[submission.types.parallel.MODULES]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[submission.types.serial.MODULES]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[submission.types.gnu.MODULES]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[submission.task_exceptions.ExtractSQlite]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[submission.task_exceptions.AddCalculatedFields.MODULES]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[submission.task_exceptions.ArchiveFDB.MODULES]
  ECMWFTOOLBOX = ["load", "ecmwf-toolbox/2025.04.0.0"]

[suite_control]
  do_interpolsstsic = false

[gribmodify.fullpos.3]
  output_name = "tp"

[gribmodify.fullpos.4]
  output_name = "10si"

[gribmodify.fullpos.5]
  output_name = "100si"

[gribmodify.fullpos.6]
  minimum_frequency = "PT1H"
  output_name = "10fg"
